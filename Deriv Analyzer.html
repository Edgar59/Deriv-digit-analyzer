<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#eff2f8">
<title>Deriv Auto Analysis</title>
<style>
:root{--bg:#eff2f8;--surface:#fff;--ink:#161b2e;--sub:#626b82;--line:#e1e5ee;--accent:#466fce;--accent-bg:rgba(70,111,206,.09);--risk:#d95969;--risk-bg:rgba(217,89,105,.1);--live:#12a879;--track:#e4e8f0;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;font-variant-numeric:tabular-nums}.wrap{max-width:1120px;margin:0 auto;padding:22px 16px 34px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px}.head h1{font-size:23px;line-height:1.2;margin:0 0 5px;letter-spacing:-.35px}.head p{margin:0;color:var(--sub);font-size:13px}.status{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:7px 11px;color:var(--sub);font-size:12px;white-space:nowrap}.status i{width:8px;height:8px;border-radius:50%;background:#9ba3b4}.status.live i{background:var(--live)}.status.error i{background:var(--risk)}.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:7px 14px;margin-bottom:14px}.row{display:flex;align-items:center;gap:10px;min-height:50px;flex-wrap:wrap}.row+.row{border-top:1px solid var(--line)}.row label{width:68px;color:var(--sub);font-size:12px}.seg{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px}.seg button{border:0;background:transparent;color:var(--sub);padding:7px 11px;border-radius:7px;font:inherit;font-size:13px;cursor:pointer}.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px #161b2e20}.field{height:36px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px}.field.num{width:75px}.row .hint{color:var(--sub);font-size:12px}.row .push{margin-left:auto}.count{font-size:12px;color:var(--sub)}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.grid{display:grid;grid-template-columns:1fr;gap:10px}.card{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:12px;min-width:0}.card.top{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-bg)}.card.pinned{border-color:#818ba3}.card.pinned.bad{border-color:var(--risk);box-shadow:0 0 0 3px var(--risk-bg)}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.market{font-size:15px;font-weight:650}.ticker{font-size:11px;color:var(--sub);font-weight:500;margin-left:6px}.meta{display:flex;align-items:center;gap:9px}.rank{font-size:11px;color:var(--sub)}.card.top .rank{color:var(--accent);font-weight:650}.card.pinned.bad .rank{color:var(--risk)}.price{font-size:16px;font-weight:650}.price em{font-style:normal;color:white;background:var(--ink);padding:1px 4px;border-radius:4px;margin-left:1px}.monitor{border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:99px;padding:5px 10px;font:inherit;font-size:11px;cursor:pointer}.monitor[aria-pressed=true]{background:var(--ink);color:white;border-color:var(--ink)}.trade{border:1px solid var(--accent);background:var(--accent);color:white;border-radius:99px;padding:5px 11px;font:inherit;font-size:11px;font-weight:650;cursor:pointer}.trade:hover{filter:brightness(.94)}.card.chosen{outline:2px solid var(--accent);outline-offset:2px}.dots{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:7px;margin:13px 0 8px}.dot{position:relative;width:100%;max-width:68px;justify-self:center;aspect-ratio:1;border-radius:50%;border:2px solid var(--track);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}.dot b{font-size:16px}.dot small{font-size:9px;color:var(--sub)}.dot.hot1{background:#4d9e75;border-color:transparent;color:white}.dot.hot2{background:#4777d2;border-color:transparent;color:white}.dot.cold1{background:#ce555a;border-color:transparent;color:white}.dot.cold2{background:#d18c35;border-color:transparent;color:white}.dot.hot1 small,.dot.hot2 small,.dot.cold1 small,.dot.cold2 small{color:white}.dot.current{box-shadow:0 0 0 3px var(--accent-bg)}.dot.current:not(.hot1):not(.hot2):not(.cold1):not(.cold2){border-color:var(--accent)}.dot.current:after{content:"";position:absolute;top:-13px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top:9px solid #39aeb7;border-bottom:0}.history-label{font-size:10px;color:var(--sub);margin:7px 0 4px}.history{display:flex;flex-wrap:wrap;gap:4px}.history span{width:19px;height:20px;display:grid;place-items:center;border-radius:4px;font-size:10px;background:var(--accent-bg);color:var(--accent)}.history .loss{background:var(--risk-bg);color:var(--risk)}.history .last{outline:2px solid var(--ink);outline-offset:1px}.empty{background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:20px;color:var(--sub);font-size:13px}.foot{color:var(--sub);font-size:11px;line-height:1.5;margin:14px 2px 0}.foot strong{color:var(--ink)}[hidden]{display:none!important}@media(max-width:640px){.wrap{padding:16px 10px 24px}.head{align-items:center}.head h1{font-size:20px}.head p{max-width:270px;font-size:12px}.status{font-size:0;padding:8px}.status i{width:9px;height:9px}.panel{padding:5px 10px}.row{gap:7px;min-height:48px}.row label{width:56px}.row .hint{font-size:11px}.row .push{margin-left:0}.dots{gap:4px 2px;margin:12px 0 7px}.dot{max-width:50px}.dot b{font-size:14px}.dot small{font-size:8px}.card{padding:10px}.market{font-size:13px}.ticker{display:block;margin:1px 0 0}.price{font-size:14px}.monitor{padding:5px 8px}.history span{width:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}

/* Additional controls and comparison panels */
.settings-button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;color:var(--ink);cursor:pointer;font:inherit}
.settings-choices{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.settings-choices[hidden]{display:none!important}
.comparison{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:11px}
.comparison-box{border:1px solid #4d9e75;border-radius:9px;padding:10px;min-width:0;display:flex;justify-content:space-between;align-items:center;gap:8px}
.comparison-box.under{border-color:var(--risk)}
.comparison-name{font-weight:650;font-size:13px}
.comparison-count{font-size:11px;color:var(--sub)}
.comparison-value{font-size:20px;font-weight:700;white-space:nowrap}
.history span{width:26px;height:26px;border-radius:50%;background:#188b59;color:#fff;font-weight:650}
.history .loss{background:#d95969;color:#fff}
@media(max-width:640px){.comparison-value{font-size:16px}.comparison-box{padding:8px}.history span{width:24px;height:24px}}
</style>
</head>
<body>
<main class="wrap">
  <header class="head"><div><h1>Digit Selector</h1><p>Compare recent digit distributions across synthetic markets.</p></div><div class="status" id="status" role="status"><i></i><span>Connecting</span></div></header>
  <section class="panel" aria-label="Scanner settings">
    <div class="row"><label>Contract</label><button class="settings-button" id="settingsButton" type="button" aria-expanded="false">⚙ Settings</button><div class="settings-choices" id="settingsChoices" hidden><select class="field" id="category" aria-label="Analysis category"><option value="overunder">Over / Under</option><option value="evenodd">Even / Odd</option></select></div><select class="field" id="contract" aria-label="Contract selection"><option value="over">Over</option><option value="under">Under</option></select><select class="field" id="bar" aria-label="Barrier digit"></select><span class="hint" id="barHelp">Losing digits: 0–2</span></div>
    <div class="row"><label>Frequency</label><input class="field num" id="limit" type="number" min="0" max="100" step="0.1" value="10.3" aria-label="Maximum frequency per losing digit"><span class="hint">%</span><span class="hint push">Sample</span><select class="field" id="window" aria-label="Recent tick sample"><option value="100">100 ticks</option><option value="250">250 ticks</option><option value="1000" selected>1,000 ticks</option></select></div>
    <div class="row"><label>Markets</label><span class="hint">Show up to</span><select class="field" id="topN" aria-label="Number of suggested markets"><option value="3" selected>3 markets</option><option value="5">5 markets</option><option value="10">10 markets</option><option value="15">All markets</option></select><span class="count push" id="count">0 / 15 live</span></div>
  </section>
  <section class="grid" id="grid" aria-label="Ranked synthetic markets"></section>
  <div class="empty" id="empty" hidden>No market currently meets this frequency screen. Adjust the screen or sample size to compare more markets.</div>
</main>
<script>
const endpoint='wss://api.derivws.com/trading/v1/options/ws/public';
const markets=[["R_10","Volatility 10"],["R_25","Volatility 25"],["R_50","Volatility 50"],["R_75","Volatility 75"],["R_100","Volatility 100"],["1HZ10V","Volatility 10 (1s)"],["1HZ25V","Volatility 25 (1s)"],["1HZ50V","Volatility 50 (1s)"],["1HZ75V","Volatility 75 (1s)"],["1HZ100V","Volatility 100 (1s)"],["JD10","Jump 10"],["JD25","Jump 25"],["JD50","Jump 50"],["JD75","Jump 75"],["JD100","Jump 100"]];
const state=Object.fromEntries(markets.map(([symbol])=>[symbol,{digits:[],pip:2,price:null,loaded:false}]));
const $=id=>document.getElementById(id),grid=$('grid'),status=$('status');let mode='over',bar=2,windowSize=1000,limit=10.3,socket=null,retry=0,request=0;const monitored=new Set();let tradeSelection=null;
function digit(price,pip){return Number(price).toFixed(pip).slice(-1)}
function setStatus(text,kind=''){status.className='status '+kind;status.querySelector('span').textContent=text}
function loses(d){d=Number(d);if(mode==='over')return d<=bar;if(mode==='under')return d>=bar;if(mode==='even')return d%2!==0;return d%2===0}
function stats(symbol){const s=state[symbol];if(!s.digits.length)return null;const digits=s.digits.slice(-windowSize),counts=Array(10).fill(0);digits.forEach(d=>counts[+d]++);let risk=0,passes=true;counts.forEach((n,d)=>{if(loses(d)){risk+=n;if(n/digits.length*100>limit)passes=false}});return{digits,counts,n:digits.length,risk:risk/digits.length*100,passes}}
function comparisonBoxes(t){const even=t.counts[0]+t.counts[2]+t.counts[4]+t.counts[6]+t.counts[8],odd=t.n-even;const over=t.counts.slice(bar+1).reduce((a,b)=>a+b,0),under=t.counts.slice(0,bar).reduce((a,b)=>a+b,0);const pair=(mode==='even'||mode==='odd')?[['Even',even],['Odd',odd]]:[[`Over ${bar}`,over],[`Under ${bar}`,under]];return `<div class="comparison">${pair.map(([name,count],i)=>`<div class="comparison-box ${i?'under':''}"><div><div class="comparison-name">${name}</div><div class="comparison-count">${count.toLocaleString()} / ${t.n.toLocaleString()} ticks</div></div><div class="comparison-value">${(count/t.n*100).toFixed(1)}%</div></div>`).join('')}</div>`}
function render(){const available=markets.map(([s,n])=>({s,n,t:stats(s)})).filter(x=>x.t);const passing=available.filter(x=>x.t.passes).sort((a,b)=>a.t.risk-b.t.risk);const top=passing.slice(0,Number($('topN').value));const show=[...available.filter(x=>monitored.has(x.s)),...top.filter(x=>!monitored.has(x.s))];$('count').textContent=`${available.length} / ${markets.length} live`;$('empty').hidden=show.length>0||available.length===0;grid.innerHTML=show.map(({s,n,t},index)=>{const rank=top.findIndex(x=>x.s===s),pinned=monitored.has(s),current=+state[s].digits.at(-1);const order=Array.from({length:10},(_,i)=>i).sort((a,b)=>t.counts[b]-t.counts[a]||a-b),classes={};if(order[0]!==undefined)classes[order[0]]='hot1';if(order[1]!==undefined)classes[order[1]]='hot2';if(order[9]!==undefined)classes[order[9]]='cold1';if(order[8]!==undefined)classes[order[8]]='cold2';const label=pinned?(t.passes?'Monitoring · passes screen':'Monitoring · outside screen'):rank===0?'Lowest losing share':`Rank ${rank+1}`;return `<article class="card ${!pinned&&rank===0?'top ':''}${pinned?'pinned ':''}${pinned&&!t.passes?'bad ':''}${tradeSelection===s?'chosen':''}" style="order:${index}"><div class="card-head"><div><span class="market">${n}</span><span class="ticker">${s}</span></div><div class="meta"><span class="rank">${label}</span><span class="price">${state[s].price?`${state[s].price.slice(0,-1)}<em>${state[s].price.slice(-1)}</em>`:'—'}</span><button class="monitor" data-monitor="${s}" aria-pressed="${pinned}">${pinned?'Monitoring':'Monitor'}</button><button class="trade" data-trade="${s}">Trade</button></div></div><div class="dots">${t.counts.map((v,d)=>`<div class="dot ${classes[d]||''} ${d===current?'current':''}" title="Digit ${d}: ${(v/t.n*100).toFixed(1)}%"><b>${d}</b><small>${(v/t.n*100).toFixed(1)}%</small></div>`).join('')}</div><div class="history-label">Last ${Math.min(20,t.n)} digits · green = winning · red = losing</div><div class="history">${t.digits.slice(-20).map((d,i,a)=>`<span class="${loses(+d)?'loss ':''}${i===a.length-1?'last':''}">${d}</span>`).join('')}</div>${comparisonBoxes(t)}</article>`}).join('');}
function requestMarket(symbol){if(socket?.readyState!==WebSocket.OPEN||state[symbol].loaded)return;socket.send(JSON.stringify({ticks_history:symbol,count:1000,end:'latest',style:'ticks',subscribe:1,req_id:++request}))}
function connect(){setStatus('Connecting');socket=new WebSocket(endpoint);const timeout=setTimeout(()=>{if(socket.readyState!==WebSocket.OPEN)socket.close()},7000);socket.onopen=()=>{clearTimeout(timeout);retry=0;markets.forEach(([s])=>requestMarket(s));setStatus('Loading markets')};socket.onmessage=event=>{let message;try{message=JSON.parse(event.data)}catch{return}if(message.error){setStatus(message.error.message,'error');return}if(message.msg_type==='history'){const symbol=message.echo_req?.ticks_history,s=state[symbol];if(!s)return;s.pip=Number(message.pip_size)||2;s.digits=(message.history?.prices||[]).map(price=>digit(price,s.pip));const last=message.history?.prices?.at(-1);s.price=last==null?null:Number(last).toFixed(s.pip);s.loaded=true}else if(message.msg_type==='tick'){const tick=message.tick,s=state[tick?.symbol];if(!s)return;s.pip=Number(tick.pip_size)||s.pip;s.price=Number(tick.quote).toFixed(s.pip);s.digits.push(digit(tick.quote,s.pip));if(s.digits.length>1000)s.digits.shift()}else return;const ready=markets.filter(([s])=>state[s].digits.length).length;setStatus(`Live · ${ready}/10 markets`,ready===10?'live':'');render()};socket.onerror=()=>setStatus('Connection issue','error');socket.onclose=()=>{clearTimeout(timeout);setStatus('Disconnected · reconnecting','error');setTimeout(connect,Math.min(1500*2**retry++,15000))}}
function updateControls(){const isOU=mode==='over'||mode==='under';$('bar').hidden=!isOU;const low=mode==='over'?0:1,high=mode==='over'?8:9;if(isOU){if(bar<low||bar>high)bar=mode==='over'?2:7;$('bar').innerHTML=Array.from({length:high-low+1},(_,i)=>low+i).map(d=>`<option value="${d}" ${d===bar?'selected':''}>${d}</option>`).join('')} $('barHelp').textContent=isOU?'Losing digits: '+(mode==='over'?`0–${bar}`:`${bar}–9`):mode==='even'?'Losing digits: 1, 3, 5, 7, 9':'Losing digits: 0, 2, 4, 6, 8';$('category').value=isOU?'overunder':'evenodd';$('contract').innerHTML=isOU?'<option value="over">Over</option><option value="under">Under</option>':'<option value="even">Even</option><option value="odd">Odd</option>';$('contract').value=mode;}
$('settingsButton').onclick=()=>{const panel=$('settingsChoices');panel.hidden=!panel.hidden;$('settingsButton').setAttribute('aria-expanded',String(!panel.hidden))};
$('category').onchange=e=>{mode=e.target.value==='evenodd'?'even':'over';updateControls();render()};
$('contract').onchange=e=>{mode=e.target.value;updateControls();render()};
$('bar').onchange=e=>{bar=Number(e.target.value);updateControls();render()};
$('limit').oninput=e=>{const value=Number(e.target.value);limit=Number.isFinite(value)?Math.max(0,Math.min(100,value)):100;render()};
$('window').onchange=e=>{windowSize=Number(e.target.value);render()};$('topN').onchange=render;grid.onclick=e=>{const trade=e.target.closest('[data-trade]');if(trade){location.href=`index.html?symbol=${encodeURIComponent(trade.dataset.trade)}`;return}const button=e.target.closest('[data-monitor]');if(!button)return;const symbol=button.dataset.monitor;monitored.has(symbol)?monitored.delete(symbol):monitored.add(symbol);render()};
updateControls();render();connect();
</script>
</body>
</html>
